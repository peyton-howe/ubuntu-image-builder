# The camera packages the stock-kernel images install, from the rk3588-cameras
# repository. Sourced by fetch-camera-debs.sh.

CAMERA_REPO="peyton-howe/rk3588-cameras"

# The release to install, and the SHA-256 of its SHA256SUMS asset (which in turn
# lists every package). Unset until the first release is published; until then
# set RK3588_CAMERA_DEBS_DIR to use locally built packages.
CAMERA_TAG=""
CAMERA_SUMS_SHA256=""

# libcamera's package name follows its soname, so it changes with libcamera's
# major.minor version.
CAMERA_LIBCAMERA_PKG="libcamera0.8"
