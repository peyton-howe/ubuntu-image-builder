# Where the stock-kernel images get the camera packages (rk3588-camera-overlays,
# rk3588-camera-dkms and libcamera) from: the Tachyn Labs apt repository, built
# and published by https://github.com/peyton-howe/rk3588-cameras. Sourced by
# setup-camera-apt.sh and common.sh.

CAMERA_APT_URL="https://apt.tachynlabs.com"
CAMERA_APT_KEY_URL="https://apt.tachynlabs.com/tachyn-archive-keyring.gpg"
# The archive key's fingerprint. The key is downloaded, and refused unless it
# is this one.
CAMERA_APT_KEY_FPR="B4E13A16962A1E26044DEF868A0AD3A4CBAA5F39"

# The Ubuntu releases the repository has a suite for. An image for another
# release is built without the camera packages.
CAMERA_APT_SUITES="stonking"

# libcamera's package name follows its soname, so it changes with libcamera's
# major.minor version.
CAMERA_LIBCAMERA_PKG="libcamera0.8"
