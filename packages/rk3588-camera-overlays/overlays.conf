# Camera overlays to enable, in Raspberry Pi dtoverlay syntax.
# One sensor plus the connector it is plugged into:
#
#   imx708,port0
#   imx219,port1
#   imx415,port0
#   imx708,port1 imx708,port2
#   imx519,port1,isp1,4lane,link-frequency=408000000
#   imx708,port0,unite
#
# The port number is the CAM number on the board:
#   Orange Pi 5 / 5B:  port1 (CAM1), port2 (CAM2), port3 (CAM3)
#   ROCK 5B+:          port0 (CAM0), port1 (CAM1)
#
# apply-overlays.sh picks the matching port overlay for the installed
# board package, bakes parameters into /var/lib/rk3588-camera/, and
# puts rk3588-isp.dtbo first. Several cameras are space-separated.
#
# Parameters (same idea as the Pi):
#   portN                 required. Which connector.
#   isp0 / isp1           which ISP this camera enables. By default the
#                         first camera in this list gets isp0 and the
#                         second gets isp1. RK3588 has those two only.
#   unite                 one camera uses both ISPs (isp_unite). A second
#                         camera, or isp0/isp1 on the same line, is rejected.
#   4lane                 four CSI data lanes instead of two
#   link-frequency=<Hz>   sensor and CSI link frequency
#   rotation=<degrees>
#   orientation=<0|1|2>   0 front, 1 rear, 2 external (default 2)
#
# imx415 defaults to four lanes at 720000000 Hz (about 60 fps);
# link-frequency=360000000 gives about 30 fps.
#
# imx708 defaults to 450000000 Hz and two lanes. Its driver works out the
# PLLs and mode timings from the link frequency and lane count, so a faster
# link gives higher frame rates (4lane,link-frequency=750000000 runs
# 4608x2592 at 45 fps). Keep it at or below 750000000: faster lanes need
# deskew calibration, which the driver does not enable.
#
# A bare overlay basename still works, for a dtbo shipped in
# /usr/share/rk3588-camera/overlays. Leave the variable empty to
# install the package without enabling a camera.
#
# If the board cannot be detected, set one of:
#   orangepi-5, orangepi-5b, rock-5b-plus
#RK3588_CAMERA_BOARD=""
RK3588_CAMERA_OVERLAYS=""
