# Space-separated overlay basenames (without path) from
# /usr/share/rk3588-camera/overlays/ to enable via u-boot-menu.
#
# Orange Pi 5 / 5B examples:
#   rk3588s-orangepi-5-cam1-imx708
#   rk3588s-orangepi-5-cam2-imx708
#   rk3588s-orangepi-5-cam3-imx708
#
# ROCK 5B+ examples:
#   rk3588-rock-5b-plus-imx708-cam0
#   rk3588-rock-5b-plus-imx708-cam1
#
# Leave empty to install overlays without enabling any.
RK3588_CAMERA_OVERLAYS=""
